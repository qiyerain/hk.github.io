<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend"><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#c4a97d" flood-opacity="0.18"/>
    </filter>
    <style>
      .title{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-weight:700;}
      .body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
    </style>
  </defs>

  <rect width="960" height="620" fill="#faf5ed"/>
  <rect width="960" height="620" fill="#f5ede0" opacity="0.3" filter="url(#paper)"/>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.6" fill="#d4c9b8"/>
  </pattern>
  <rect width="960" height="620" fill="url(#dots)" opacity="0.5"/>

  <!-- 标题 -->
  <text x="480" y="50" text-anchor="middle" class="title" font-size="26" fill="#3a3a3a">三层 Skill 编排架构</text>
  <text x="480" y="74" text-anchor="middle" class="body" font-size="13" fill="#8b7355">不重造，只缝合：编排器 + 渲染引擎 + 发布引擎</text>

  <!-- 第一层：编排器 -->
  <rect x="180" y="110" width="600" height="100" rx="14" fill="#fff" stroke="#7ba8c9" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="220" cy="160" r="22" fill="#e3f0f7" stroke="#7ba8c9" stroke-width="1.5"/>
  <!-- 指挥棒 icon -->
  <line x1="220" y1="148" x2="220" y2="172" stroke="#5a8faf" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="220" y1="154" x2="210" y2="168" stroke="#5a8faf" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="220" y1="154" x2="230" y2="168" stroke="#5a8faf" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="213" cy="145" r="2.5" fill="#e8c36a"/>

  <text x="260" y="148" class="title" font-size="20" fill="#3a3a3a">编排层 · wechat-article-generator</text>
  <text x="260" y="172" class="body" font-size="13" fill="#5a8faf">调度 · 质控 · 降级兜底（自研 ≈ 400 行 Python）</text>
  <rect x="260" y="184" width="80" height="18" rx="9" fill="#e3f0f7"/>
  <text x="300" y="197" text-anchor="middle" class="body" font-size="11" fill="#4a7fa5">选题研究</text>
  <rect x="346" y="184" width="60" height="18" rx="9" fill="#e3f0f7"/>
  <text x="376" y="197" text-anchor="middle" class="body" font-size="11" fill="#4a7fa5">写稿</text>
  <rect x="412" y="184" width="90" height="18" rx="9" fill="#fef2f2" stroke="#e07070" stroke-width="0.8"/>
  <text x="457" y="197" text-anchor="middle" class="body" font-size="11" fill="#c05050">Quality Gate</text>
  <rect x="508" y="184" width="80" height="18" rx="9" fill="#f3e8ff"/>
  <text x="548" y="197" text-anchor="middle" class="body" font-size="11" fill="#8a6ab5">博客发布</text>
  <rect x="594" y="184" width="80" height="18" rx="9" fill="#fde8cd"/>
  <text x="634" y="197" text-anchor="middle" class="body" font-size="11" fill="#c4893a">平台草稿</text>

  <!-- 向下箭头分叉 -->
  <line x1="480" y1="210" x2="480" y2="240" stroke="#9ab8cc" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M480,240 L260,260" fill="none" stroke="#9ab8cc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <path d="M480,240 L700,260" fill="none" stroke="#9ab8cc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="290" y="252" class="body" font-size="11" fill="#8b7355">委托渲染</text>
  <text x="630" y="252" class="body" font-size="11" fill="#8b7355">委托发布</text>

  <!-- 第二层：渲染引擎（左） -->
  <rect x="50" y="270" width="380" height="160" rx="14" fill="#fff" stroke="#e8a54c" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="100" cy="320" r="22" fill="#fef3e2" stroke="#e8a54c" stroke-width="1.5"/>
  <!-- 调色盘 -->
  <ellipse cx="98" cy="318" rx="13" ry="11" fill="#fef3e2" stroke="#c4893a" stroke-width="1.2"/>
  <circle cx="93" cy="313" r="2.5" fill="#7ba8c9"/>
  <circle cx="102" cy="312" r="2.5" fill="#e8c36a"/>
  <circle cx="105" cy="320" r="2.5" fill="#a8c97b"/>
  <circle cx="95" cy="323" r="2.5" fill="#e07070"/>

  <text x="135" y="310" class="title" font-size="18" fill="#3a3a3a">渲染层 · md2wechat</text>
  <text x="135" y="330" class="body" font-size="12" fill="#c4893a">Markdown → 内联样式 HTML</text>

  <!-- 主题数字 -->
  <rect x="64" y="350" width="80" height="60" rx="10" fill="#fef3e2" stroke="#e8a54c" stroke-width="1"/>
  <text x="104" y="380" text-anchor="middle" class="title" font-size="28" fill="#c4893a">52</text>
  <text x="104" y="398" text-anchor="middle" class="body" font-size="11" fill="#8b7355">个主题</text>

  <rect x="156" y="350" width="80" height="60" rx="10" fill="#fef3e2" stroke="#e8a54c" stroke-width="1"/>
  <text x="196" y="380" text-anchor="middle" class="title" font-size="28" fill="#c4893a">43</text>
  <text x="196" y="398" text-anchor="middle" class="body" font-size="11" fill="#8b7355">版式模块</text>

  <rect x="248" y="350" width="170" height="60" rx="10" fill="#fdf6ee" stroke="#d4b896" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="333" y="372" text-anchor="middle" class="body" font-size="11" fill="#8b7355">inspect → preview</text>
  <text x="333" y="390" text-anchor="middle" class="body" font-size="11" fill="#8b7355">→ convert</text>
  <text x="333" y="404" text-anchor="middle" class="body" font-size="10" fill="#c9b896">发现驱动 Discovery-First</text>

  <!-- 中间：Quality Gate -->
  <rect x="440" y="320" width="80" height="80" rx="40" fill="#fef2f2" stroke="#e07070" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- 盾牌 -->
  <path d="M480,335 C474,330 486,326 480,326 C474,326 486,330 480,335Z" fill="none" stroke="#e07070" stroke-width="1.5"/>
  <path d="M470,340 C468,332 480,328 480,328 C480,328 492,332 490,340 C490,352 480,365 480,365 C480,365 470,352 470,340Z" fill="none" stroke="#d05050" stroke-width="2"/>
  <path d="M474,344 L479,350 L488,338" fill="none" stroke="#a8c97b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="385" text-anchor="middle" class="title" font-size="13" fill="#c05050">6 项</text>
  <text x="480" y="397" text-anchor="middle" class="body" font-size="10" fill="#c05050">硬阻断</text>

  <!-- 第二层：发布引擎（右） -->
  <rect x="530" y="270" width="380" height="160" rx="14" fill="#fff" stroke="#e07070" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="580" cy="320" r="22" fill="#fef2f2" stroke="#e07070" stroke-width="1.5"/>
  <!-- 火箭 -->
  <path d="M580,308 C574,316 576,326 580,330 C584,326 586,316 580,308Z" fill="#e07070" stroke="#c05050" stroke-width="1"/>
  <line x1="576" y1="330" x2="573" y2="338" stroke="#c05050" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="580" y1="330" x2="580" y2="340" stroke="#e8c36a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="584" y1="330" x2="587" y2="338" stroke="#c05050" stroke-width="1.5" stroke-linecap="round"/>

  <text x="615" y="310" class="title" font-size="18" fill="#3a3a3a">发布层 · baoyu-post-to-wechat</text>
  <text x="615" y="330" class="body" font-size="12" fill="#c05050">三通道发布 + 多账号支持</text>

  <!-- 三通道 -->
  <rect x="544" y="350" width="116" height="28" rx="6" fill="#fef2f2" stroke="#e07070" stroke-width="1"/>
  <text x="602" y="368" text-anchor="middle" class="body" font-size="11" fill="#c05050">服务端接口</text>
  <rect x="672" y="350" width="116" height="28" rx="6" fill="#fef2f2" stroke="#e07070" stroke-width="1"/>
  <text x="730" y="368" text-anchor="middle" class="body" font-size="11" fill="#c05050">远程隧道</text>
  <rect x="800" y="350" width="100" height="28" rx="6" fill="#fef2f2" stroke="#e07070" stroke-width="1"/>
  <text x="850" y="368" text-anchor="middle" class="body" font-size="11" fill="#c05050">浏览器自动化</text>

  <text x="544" y="396" class="body" font-size="11" fill="#8b7355">4 主题 + 13 色板 · 多账号一等公民</text>
  <text x="544" y="412" class="body" font-size="11" fill="#c9b896">参数驱动 · 工程化（TypeScript + 测试覆盖）</text>

  <!-- 向下箭头 -->
  <line x1="220" y1="430" x2="220" y2="470" stroke="#9ab8cc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="215,467 220,477 225,467" fill="#9ab8cc"/>
  <line x1="730" y1="430" x2="730" y2="470" stroke="#9ab8cc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="725,467 730,477 735,467" fill="#9ab8cc"/>

  <!-- 输出：博客 -->
  <rect x="100" y="480" width="240" height="80" rx="12" fill="#fff" stroke="#a88cc9" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="140" cy="520" r="20" fill="#f3e8ff" stroke="#a88cc9" stroke-width="1.2"/>
  <!-- 文档 icon -->
  <rect x="132" y="510" width="16" height="20" rx="2" fill="#fff" stroke="#8a6ab5" stroke-width="1.2"/>
  <line x1="135" y1="516" x2="145" y2="516" stroke="#8a6ab5" stroke-width="0.8"/>
  <line x1="135" y1="521" x2="145" y2="521" stroke="#8a6ab5" stroke-width="0.8"/>
  <line x1="135" y1="526" x2="142" y2="526" stroke="#8a6ab5" stroke-width="0.8"/>
  <text x="175" y="515" class="title" font-size="16" fill="#3a3a3a">Hexo 博客</text>
  <text x="175" y="535" class="body" font-size="11" fill="#8a6ab5">source/_posts/*.md</text>
  <text x="175" y="550" class="body" font-size="11" fill="#c9b0dd">npm run build 验证</text>

  <!-- 输出：平台 -->
  <rect x="620" y="480" width="240" height="80" rx="12" fill="#fff" stroke="#e07070" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="660" cy="520" r="20" fill="#fef2f2" stroke="#e07070" stroke-width="1.2"/>
  <!-- 信封 -->
  <rect x="652" y="513" width="16" height="12" rx="2" fill="#fff" stroke="#c05050" stroke-width="1.2"/>
  <path d="M652,513 L660,521 L668,513" fill="none" stroke="#c05050" stroke-width="1"/>
  <text x="695" y="515" class="title" font-size="16" fill="#3a3a3a">内容平台草稿</text>
  <text x="695" y="535" class="body" font-size="11" fill="#c05050">默认只存草稿</text>
  <text x="695" y="550" class="body" font-size="11" fill="#e8b0b0">不主动发布</text>

  <!-- 装饰 -->
  <g fill="#e8c36a" opacity="0.5">
    <path d="M870,140 l2,-6 2,6 -6,-2 6,0 -6,2z"/>
    <circle cx="60" cy="240" r="2.5"/>
    <path d="M460,580 l2,-5 2,5 -5,-2 5,0 -5,2z"/>
    <circle cx="900" cy="600" r="2"/>
    <path d="M50,540 l1.5,-4 1.5,4 -4,-1.5 4,0 -4,1.5z"/>
  </g>
</svg>
