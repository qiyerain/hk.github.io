<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#fdfdfd"/>

  <!-- === Title === -->
  <text x="450" y="38" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="20" font-weight="700" fill="#1e293b">8 步工作流 ✏️</text>
  <!-- Wobbly underline -->
  <path d="M350,44 C400,40 500,48 550,42" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- === Step boxes - staircase layout === -->

  <!-- Step 1 -->
  <rect x="40" y="65" width="150" height="42" rx="10" fill="#e8f4fd" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" transform="rotate(-1,115,86)"/>
  <text x="115" y="91" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#1e40af">1 Intake 接单</text>

  <!-- Wobbly arrow -->
  <path d="M190,86 C210,84 215,90 230,88" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="225,83 235,88 225,93" fill="#94a3b8"/>

  <!-- Step 2 -->
  <rect x="240" y="65" width="170" height="42" rx="10" fill="#e8f4fd" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" transform="rotate(0.5,325,86)"/>
  <text x="325" y="91" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#1e40af">2 Research 研究</text>

  <path d="M410,86 C430,84 435,90 450,88" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="445,83 455,88 445,93" fill="#94a3b8"/>

  <!-- Step 3 -->
  <rect x="460" y="65" width="150" height="42" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-linecap="round" transform="rotate(-0.5,535,86)"/>
  <text x="535" y="91" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#15803d">3 Write 写稿</text>

  <path d="M610,86 C630,84 635,90 650,88" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="645,83 655,88 645,93" fill="#94a3b8"/>

  <!-- Step 4 -->
  <rect x="660" y="65" width="180" height="42" rx="10" fill="#fef9ef" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" transform="rotate(0.8,750,86)"/>
  <text x="750" y="91" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#92400e">4 PicGo 图片↑</text>

  <!-- Curved arrow down to row 2 -->
  <path d="M750,107 C748,120 752,130 750,140" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="745,135 750,148 755,135" fill="#94a3b8"/>

  <!-- Step 5 -->
  <rect x="620" y="150" width="230" height="42" rx="10" fill="#fef9ef" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" transform="rotate(-0.5,735,171)"/>
  <text x="735" y="176" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#92400e">5 Render 渲染 🎨</text>

  <!-- Step 6 GATE - big and red -->
  <path d="M620,171 C600,170 580,172 560,171" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <rect x="360" y="140" width="200" height="62" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="3" stroke-linecap="round" transform="rotate(0.5,460,171)"/>
  <!-- Shield icon -->
  <path d="M400,160 C398,152 404,148 408,148 C412,148 418,152 416,160 C416,168 408,174 408,174 C408,174 400,168 400,160Z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <text x="480" y="167" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="16" font-weight="700" fill="#dc2626">6 Gate 质量门</text>
  <text x="480" y="188" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#ef4444">6 项指标 · 不过即停 🛑</text>

  <!-- Arrows from Gate -->
  <path d="M460,202 C462,220 458,235 460,250" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="454,245 460,258 466,245" fill="#94a3b8"/>

  <!-- Step 7 -->
  <rect x="310" y="260" width="240" height="42" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" stroke-linecap="round" transform="rotate(-0.3,430,281)"/>
  <text x="430" y="286" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#7e22ce">7 Blog 博客发布 📝</text>

  <path d="M550,281 C570,279 575,285 590,283" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="585,278 595,283 585,288" fill="#94a3b8"/>

  <!-- Step 8 -->
  <rect x="600" y="260" width="240" height="42" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-linecap="round" transform="rotate(0.5,720,281)"/>
  <text x="720" y="286" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#991b1b">8 Draft 平台草稿 📮</text>

  <!-- === RIGHT PANEL: 3 Principles === -->
  <rect x="40" y="330" width="820" height="200" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8,4"/>
  <text x="450" y="360" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="17" font-weight="700" fill="#1e293b">三大设计原则 💡</text>

  <!-- Principle 1 -->
  <rect x="60" y="380" width="230" height="120" rx="10" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" transform="rotate(-0.5,175,440)"/>
  <text x="175" y="408" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#1e40af">🔍 发现优先</text>
  <text x="175" y="432" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#3b82f6">不靠记忆猜能力</text>
  <text x="175" y="452" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#3b82f6">先跑命令拿事实</text>
  <text x="175" y="472" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#3b82f6">再选主题/版式</text>
  <text x="175" y="492" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="10" fill="#94a3b8">避免硬编码过期</text>

  <!-- Principle 2 -->
  <rect x="330" y="380" width="230" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" transform="rotate(0.5,445,440)"/>
  <text x="445" y="408" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#dc2626">🛑 硬阻断</text>
  <text x="445" y="432" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#ef4444">检查不过就停</text>
  <text x="445" y="452" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#ef4444">绝不静默降级</text>
  <text x="445" y="472" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#ef4444">列出 blockers</text>
  <text x="445" y="492" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="10" fill="#94a3b8">防止"看起来OK但不能发"</text>

  <!-- Principle 3 -->
  <rect x="600" y="380" width="230" height="120" rx="10" fill="#fef9ef" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" transform="rotate(-0.3,715,440)"/>
  <text x="715" y="408" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="14" font-weight="700" fill="#92400e">🔄 幂等重跑</text>
  <text x="715" y="432" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#d97706">state.json 记录</text>
  <text x="715" y="452" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#d97706">已上传图不重传</text>
  <text x="715" y="472" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#d97706">media_id 复用</text>
  <text x="715" y="492" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="10" fill="#94a3b8">中断重跑零浪费</text>

  <!-- Decorative doodles -->
  <text x="25" y="25" font-size="20" fill="#fbbf24" transform="rotate(-12,25,25)">★</text>
  <text x="870" y="330" font-size="16" fill="#a855f7" transform="rotate(8,870,330)">✦</text>
  <!-- Small squiggly -->
  <path d="M780,530 C800,526 810,534 830,528" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
</svg>
