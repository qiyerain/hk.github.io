font:
  global-font-size: 16px

menu:
  首页: / || anzhiyu-icon-house
  文章: /archives/ || anzhiyu-icon-box-archive
  GitHub趋势: /github-trends/ || anzhiyu-icon-chart-line
  相册: /album/ || anzhiyu-icon-images
  关于: /about/ || anzhiyu-icon-paper-plane

social:
  GitHub: https://github.com/wwrtpfa || anzhiyu-icon-github
  Email: mailto:17752683350@qq.com || anzhiyu-icon-envelope

avatar:
  img: /img/about/pengfanao-profile.jpg
  effect: false

reward:
  enable: true
  QR_code:
    - img: /img/reward/wechat-pay-qr.png
      link:
      text: 微信
    - img: /img/reward/alipay-pay-qr.jpg
      link:
      text: 支付宝


# nav相关配置
nav:
  enable: false
  travelling: false
  clock: false
  menu:
    - title: 网页
      item:
        - name: 博客
          link: https://blog.pengfanao.top/
          icon: /img/favicon.png
    - title: 项目
      item:
        - name: 安知鱼图床
          link: https://image.anheyu.com/
          icon: https://image.anheyu.com/favicon.ico

# 代码颜色
highlight_theme: darker

# ======================= SEO 优化 =======================
seo:
  canonical: true
  og: true
  jsonld: true  # 启用 JSON-LD 结构化数据

# Open Graph
Open_Graph_meta:
  enable: true
  option:
    twitter_card: summary_large_image
    twitter_site: "@pengfanao"

# 评论
comments:
  # Up to two comments system, the first will be shown as default
  # Choose: Valine/Waline/Twikoo/
  use: Giscus # 基于 GitHub Discussions，免费无需服务器
  text: true # Display the comment name next to the button
  # lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comment count will be invalid
  lazyload: true # 启用懒加载优化性能
  count: true # Display comment count in post's top_img
  card_post_count: false # Display comment count in Home Page

# Giscus 评论
# 访问 https://giscus.app 获取以下配置值
# 前提：GitHub 仓库需启用 Discussions 功能
giscus:
  repo: wwrtpfa/blog_coment
  repo_id: R_kgDOSnUapA
  category_id: DIC_kwDOSnUapM4C9zx8
  theme:
    light: light
    dark: dark
  option:
    data-lang: zh-CN
    data-category: Announcements
    data-mapping: pathname

# ======================= 搜索配置 =======================
# Algolia 搜索
algolia_search:
  enable: false
  hits:
    per_page: 10

# 本地搜索
local_search:
  enable: true
  preload: false
  CDN:


# 标签卖萌
diytitle:
  enable: true
  leaveTitle: w(ﾟДﾟ)w 不要走！再看看嘛！
  backTitle: ♪(^∇^*)欢迎肥来！


# 主色调相关配置
mainTone:
  enable: false # 关闭主色调API，减少外部请求
  mode: both # cdn/api/both cdn模式为图片url+imageAve参数获取主色调，api模式为请求API获取主色调，both模式会先请求cdn参数，无法获取的情况下将请求API获取
  # 项目地址：https://github.com/anzhiyu-c/img2color-go
  api: https://color.anheyu.com/api?img= # mode为api时可填写
  cover_change: true # 整篇文章跟随cover修改主色调


cover:
  # 是否显示文章封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 封面显示的位置
  # 三个值可配置 left , right , both
  position: both
  # 当没有设置cover时，默认的封面显示
  default_cover:
    - /img/covers/cover-1.webp
    - /img/covers/cover-2.webp
    - /img/covers/cover-3.webp
    - /img/covers/cover-4.webp
    - /img/covers/cover-5.webp
    - /img/covers/cover-6.webp
    - /img/covers/cover-7.webp
    - /img/covers/cover-8.webp


# 首页横幅背景图
index_img: /img/covers/home/site-topics.svg
# 页面默认顶部背景图
default_top_img: /img/covers/cover-2.webp
# 文章默认顶部大图
top_img: /img/covers/cover-3.webp


# Loading Animation (加载动画)
preloader:
  enable: false
  # source
  # 1. fullpage-loading
  # 2. pace (progress bar)
  # else all
  source: 3
  # pace theme (see https://codebyzach.github.io/pace/)
  pace_css_url:
  avatar: # 自定义头像


# https://github.com/vinta/pangu.js
# Insert a space between Chinese character and English character (中英文之间添加空格)
pangu:
  enable: false
  field: post # site/post



# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true


#分享
sharejs:
  enable: true
  sites: facebook,twitter,wechat,weibo,qq #想要显示的内容



  # 欢迎语配置
greetingBox:
  enable: false
  default: 晚上好👋
  list:
    - greeting: 晚安😴
      startTime: 0
      endTime: 5
    - greeting: 早上好鸭👋, 祝你一天好心情！
      startTime: 6
      endTime: 9
    - greeting: 上午好👋, 状态很好，鼓励一下～
      startTime: 10
      endTime: 10
    - greeting: 11点多啦, 在坚持一下就吃饭啦～
      startTime: 11
      endTime: 11
    - greeting: 午安👋, 宝贝
      startTime: 12
      endTime: 14
    - greeting: 🌈充实的一天辛苦啦！
      startTime: 14
      endTime: 18
    - greeting: 19点喽, 奖励一顿丰盛的大餐吧🍔。
      startTime: 19
      endTime: 19
    - greeting: 晚上好👋, 在属于自己的时间好好放松😌~
      startTime: 20
      endTime: 24


# 动效
dynamicEffect:
  postTopWave: false # 关闭波浪效果
  postTopRollZoomInfo: false # 关闭滚动缩放
  pageCommentsRollZoom: false # 关闭评论滚动缩放

  # 深色模式粒子效果canvas
universe:
  enable: false # 关闭主题粒子效果（已有自定义粒子）


# aside (侧边栏)
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true # display on mobile
  position: right # left or right
  display: # 控制对应详情页面是否显示侧边栏
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: <div class="pfa-author-hover-copy">在复杂系统里寻找确定性，在日常折腾中保持好奇。</div>
    name_link: /about
  card_announcement:
    enable: false
    content: 欢迎来看我的博客鸭~
  card_weixin:
    enable: true
    face: /img/about/pengfanao-profile.jpg
    backFace: /img/wechat/qrcode.jpg
  card_recent_post:
    enable: true
    limit: 5 # if set 0 will show all
    sort: date # date or updated
    sort_order: # Don't modify the setting unless you know how it works
  card_categories:
    enable: false
    limit: 8 # if set 0 will show all
    expand: none # none/true/false
    sort_order: # Don't modify the setting unless you know how it works
  card_tags:
    enable: true
    limit: 40 # if set 0 will show all
    color: false
    sort_order: # Don't modify the setting unless you know how it works
    highlightTags:
      - Hexo
      - 前端
  card_archives:
    enable: true
    type: monthly # yearly or monthly
    format: MMMM YYYY # eg: YYYY年MM月
    order: -1 # Sort of order. 1, asc for ascending; -1, desc for descending
    limit: 8 # if set 0 will show all
    sort_order: # Don't modify the setting unless you know how it works
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: false
    sort_order: # Don't modify the setting unless you know how it works


#访问人数 busuanzi
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

  # Time difference between publish date and now (网页运行时间)
# Formal: Month/Day/Year Time or Year/Month/Day Time
runtimeshow:
  enable: true
  publish_date: 8/1/2024 00:00:00


  # Console - Newest Comments
newest_comments:
  enable: true
  sort_order: # Don't modify the setting unless you know how it works
  limit: 6
  storage: 10 # unit: mins, save data to localStorage
  avatar: true

# ======================= 墨流主题色（深色模式为默认） =======================
theme_color:
  enable: true
  main: "#60A5FA"
  dark_main: "#60A5FA"
  paginator: "#60A5FA"
  button_hover: "#93C5FD"
  text_selection: "#60A5FA"
  link_color: "#60A5FA"
  meta_color: "rgba(209,213,219,0.8)"
  hr_color: "#60A5FA"
  code_foreground: "#60A5FA"
  code_background: "rgba(96,165,250,0.1)"
  toc_color: "#60A5FA"
  blockquote_padding_color: "#60A5FA"
  blockquote_background_color: "rgba(96,165,250,0.1)"
  scrollbar_color: "#60A5FA"

# 显示模式（默认白天/light模式）
display_mode: light

# 深色模式配置
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ======================= CDN 配置 =======================
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  option:
    meting_api: https://api.mizore.cn/meting/api

# ======================= 左下角音乐 =======================
nav_music:
  enable: true
  id: 8152976493
  server: netease
  volume: 0.7

# 关闭首页 canvas 互动图，减少首屏远程图片请求和渲染开销
peoplecanvas:
  enable: false

# Disable the theme's novelty camera/monitoring console messages in production.
console:
  enable: false

# 关闭文章顶部 AI 摘要脚本配置，避免文章页额外执行本地摘要逻辑
post_head_ai_description:
  enable: false

# ======================= 注入自定义资源 =======================
# 新皮肤：灰阶玻璃光晕；Hero 使用本地背景，避免依赖无效的示例视频地址
inject:
  head:
    - <link rel="stylesheet" href="/custom/xiaoao-redesign.css?v=20261024-reading-bg">
    - <script>window.__DEFAULT_STYLE_PACK = "A";</script>
  bottom:
    - <script src="/js/reading-progress.js"></script>
    - <script src="/js/xiaoao-site.js"></script>
    - <script src="/js/xiaoao-experience.js"></script>
    - <script src="/js/blog-analytics.js"></script>
    - <script src="/js/style-pack-loader.js"></script>
