  <text x="104" y="334" fill="#39786e" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="28" font-weight="800">三层原理</text>
  <text x="104" y="384" fill="#211f1b" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24">1. 内容层：来源、观点、结构和证据先成立</text>
  <text x="104" y="424" fill="#211f1b" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24">2. 表现层：海报、正文图、颜色层次和移动端节奏</text>
  <text x="104" y="464" fill="#211f1b" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24">3. 发布层：博客沉淀、微信预览、草稿上传和发布确认</text>
