<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#faf9f6" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#333">6 套专属风格系统 Style Packs A–F</text>

  <!-- Pack A -->
  <rect x="30" y="55" width="230" height="130" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="30" y="55" width="230" height="32" rx="10" fill="#616161"/>
  <text x="145" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A · 灰阶玻璃 Mono Glass</text>
  <text x="50" y="108" font-size="10" fill="#666">✦ 墨色标题 + 浅灰正文</text>
  <text x="50" y="124" font-size="10" fill="#666">✦ 玻璃质感边框</text>
  <text x="50" y="140" font-size="10" fill="#666">✦ 零色彩干扰 · 随笔/产品</text>
  <text x="50" y="158" font-size="9" fill="#999">fallback: ink-minimal</text>

  <!-- Pack B -->
  <rect x="285" y="55" width="230" height="130" rx="10" fill="#fef9ef" stroke="#c9a96e" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="285" y="55" width="230" height="32" rx="10" fill="#8b4513"/>
  <text x="400" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B · 报刊编辑部 Editorial</text>
  <text x="305" y="108" font-size="10" fill="#666">✦ 米黄底纸 + 衬线大标</text>
  <text x="305" y="124" font-size="10" fill="#666">✦ 朱红章节序号</text>
  <text x="305" y="140" font-size="10" fill="#666">✦ NYT 深度感 · 人物/技术史</text>
  <text x="305" y="158" font-size="9" fill="#999">fallback: nyt-classic</text>

  <!-- Pack C -->
  <rect x="540" y="55" width="230" height="130" rx="10" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="540" y="55" width="230" height="32" rx="10" fill="#1565c0"/>
  <text x="655" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C · 光感卡片 Card Modern</text>
  <text x="560" y="108" font-size="10" fill="#666">✦ 蓝色主色 + 数字徽章</text>
  <text x="560" y="124" font-size="10" fill="#666">✦ 圆角卡片 + 左侧色条</text>
  <text x="560" y="140" font-size="10" fill="#666">✦ 清单/教程 · sspai 风</text>
  <text x="560" y="158" font-size="9" fill="#999">fallback: sspai-red</text>

  <!-- Pack D -->
  <rect x="30" y="210" width="230" height="130" rx="10" fill="#1a1a2e" stroke="#7c4dff" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="30" y="210" width="230" height="32" rx="10" fill="#7c4dff"/>
  <text x="145" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D · 暗夜终端 Cyber Local</text>
  <text x="50" y="263" font-size="10" fill="#b0bec5">✦ 深色容器 + 霓虹紫青</text>
  <text x="50" y="279" font-size="10" fill="#b0bec5">✦ README 即视感代码块</text>
  <text x="50" y="295" font-size="10" fill="#b0bec5">✦ AI/Agent/源码向</text>
  <text x="50" y="313" font-size="9" fill="#78909c">fallback: github-readme</text>

  <!-- Pack E -->
  <rect x="285" y="210" width="230" height="130" rx="10" fill="#faf5ef" stroke="#a1887f" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="285" y="210" width="230" height="32" rx="10" fill="#8d6e63"/>
  <text x="400" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">E · 莫兰迪生活 Muted Life</text>
  <text x="305" y="263" font-size="10" fill="#666">✦ 奶油底 + 灰豆沙</text>
  <text x="305" y="279" font-size="10" fill="#666">✦ 低饱和温柔色系</text>
  <text x="305" y="295" font-size="10" fill="#666">✦ 周记/阅读/慢思考</text>
  <text x="305" y="313" font-size="9" fill="#999">fallback: mint-fresh</text>

  <!-- Pack F -->
  <rect x="540" y="210" width="230" height="130" rx="10" fill="#fff5f5" stroke="#c62828" stroke-width="1.8" filter="url(#sketch)"/>
  <rect x="540" y="210" width="230" height="32" rx="10" fill="#b71c1c"/>
  <text x="655" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">F · 冲击标题 Bold Block</text>
  <text x="560" y="263" font-size="10" fill="#666">✦ 墨红满底色标题 + 金色</text>
  <text x="560" y="279" font-size="10" fill="#666">✦ 超大字号冲击</text>
  <text x="560" y="295" font-size="10" fill="#666">✦ 热点/大新闻/立场评论</text>
  <text x="560" y="313" font-size="9" fill="#999">fallback: bold-red</text>

  <!-- Bottom: intent routing -->
  <rect x="30" y="370" width="740" height="130" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#sketch)"/>
  <text x="400" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#555">按内容意图自动路由</text>

  <!-- Routing arrows -->
  <text x="80" y="425" font-size="11" fill="#616161">随笔/产品 → </text>
  <rect x="155" y="412" width="30" height="18" rx="4" fill="#616161"/>
  <text x="170" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">A</text>

  <text x="210" y="425" font-size="11" fill="#8b4513">深度/人物 → </text>
  <rect x="285" y="412" width="30" height="18" rx="4" fill="#8b4513"/>
  <text x="300" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">B</text>

  <text x="340" y="425" font-size="11" fill="#1565c0">教程/清单 → </text>
  <rect x="415" y="412" width="30" height="18" rx="4" fill="#1565c0"/>
  <text x="430" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">C</text>

  <text x="80" y="460" font-size="11" fill="#7c4dff">AI/源码 → </text>
  <rect x="155" y="447" width="30" height="18" rx="4" fill="#7c4dff"/>
  <text x="170" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">D</text>

  <text x="210" y="460" font-size="11" fill="#8d6e63">周记/阅读 → </text>
  <rect x="285" y="447" width="30" height="18" rx="4" fill="#8d6e63"/>
  <text x="300" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">E</text>

  <text x="340" y="460" font-size="11" fill="#b71c1c">热点/评论 → </text>
  <rect x="415" y="447" width="30" height="18" rx="4" fill="#b71c1c"/>
  <text x="430" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">F</text>

  <!-- Note -->
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#999">每套 Pack = 完整内联 CSS 视觉系统 · H1/H2/H3/段落/引用/分隔线/图片/CTA/页脚</text>
</svg>
