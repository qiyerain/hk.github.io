<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- White background -->
  <rect width="900" height="500" fill="#fdfdfd"/>

  <!-- Hand-drawn wobbly line helper: each shape uses slightly offset control points -->

  <!-- === ORCHESTRATOR BOX (top) === -->
  <rect x="240" y="35" width="420" height="100" rx="6" fill="#e8f4fd" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-0.5,450,85)"/>
  <!-- Conductor doodle -->
  <circle cx="295" cy="72" r="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="295" y1="86" x2="295" y2="115" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="295" y1="96" x2="280" y2="108" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="295" y1="96" x2="310" y2="108" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Baton -->
  <line x1="295" y1="66" x2="278" y2="48" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="450" y="78" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="22" font-weight="700" fill="#1e40af">编排层 Orchestrator</text>
  <text x="450" y="104" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="13" fill="#3b82f6">调度 · 质控 · 降级兜底</text>

  <!-- Arrow 1 (wobbly) -->
  <path d="M450,135 C452,155 448,165 450,180" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0"/>
  <polygon points="443,175 450,190 457,175" fill="#94a3b8"/>

  <!-- === RENDERER BOX (middle) === -->
  <rect x="40" y="195" width="330" height="100" rx="6" fill="#fef9ef" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0.3,205,245)"/>
  <!-- Paint brush doodle -->
  <path d="M85,230 C80,220 75,225 78,232 C81,239 90,235 85,230Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <line x1="78" y1="232" x2="65" y2="255" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="205" y="237" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="20" font-weight="700" fill="#92400e">渲染层 Renderer</text>
  <text x="205" y="263" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="13" fill="#d97706">52 主题 · 43 版式</text>

  <!-- Arrow to Gate -->
  <path d="M450,135 C460,155 440,165 450,180" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450,190 C452,210 448,220 450,235" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="443,230 450,245 457,230" fill="#94a3b8"/>

  <!-- === QUALITY GATE (center) === -->
  <rect x="390" y="250" width="120" height="50" rx="25" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" transform="rotate(-0.8,450,275)"/>
  <text x="450" y="279" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="15" font-weight="700" fill="#dc2626">Gate ✋</text>

  <!-- Arrow from Gate -->
  <path d="M450,300 C452,320 448,330 450,345" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="443,340 450,355 457,340" fill="#94a3b8"/>

  <!-- === PUBLISHER BOX (right) === -->
  <rect x="530" y="195" width="330" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-0.3,695,245)"/>
  <!-- Rocket doodle -->
  <path d="M575,235 C568,220 575,210 580,215 C585,210 592,220 585,235" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="575" y1="235" x2="570" y2="248" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="580" y1="235" x2="580" y2="250" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="585" y1="235" x2="590" y2="248" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <text x="695" y="237" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="20" font-weight="700" fill="#991b1b">发布层 Publisher</text>
  <text x="695" y="263" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="13" fill="#ef4444">3 通道 · 多账号</text>

  <!-- Arrow from Renderer to Gate (horizontal) -->
  <path d="M370,245 C380,243 385,244 390,245" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="385,240 395,245 385,250" fill="#94a3b8"/>

  <!-- Arrow from Gate to Publisher (horizontal) -->
  <path d="M510,275 C520,273 525,272 530,270" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="525,265 535,270 525,275" fill="#94a3b8"/>

  <!-- === OUTPUT SECTION (bottom) === -->
  <!-- Blog output -->
  <rect x="200" y="365" width="180" height="55" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" transform="rotate(0.5,290,392)"/>
  <text x="290" y="390" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="15" font-weight="700" fill="#7e22ce">📝 Hexo 博客</text>
  <text x="290" y="410" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#a855f7">source/_posts/</text>

  <!-- Platform output -->
  <rect x="520" y="365" width="180" height="55" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" transform="rotate(-0.5,610,392)"/>
  <text x="610" y="390" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="15" font-weight="700" fill="#dc2626">📮 平台草稿</text>
  <text x="610" y="410" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="11" fill="#ef4444">3 通道发布</text>

  <!-- Arrows to outputs -->
  <path d="M350,345 C360,355 370,360 380,365" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M550,345 C540,355 530,360 520,365" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- === DECORATIVE DOODLES === -->
  <!-- Stars -->
  <text x="30" y="50" font-size="22" fill="#fbbf24" transform="rotate(-15,30,50)">★</text>
  <text x="860" y="80" font-size="18" fill="#fbbf24" transform="rotate(10,860,80)">★</text>
  <text x="50" y="470" font-size="16" fill="#a855f7" transform="rotate(-8,50,470)">✦</text>

  <!-- Wobbly underline for emphasis -->
  <path d="M55,440 C70,436 80,444 100,438 C120,432 140,442 160,436" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Annotation bubbles -->
  <rect x="650" y="340" width="160" height="30" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" transform="rotate(1,730,355)"/>
  <text x="730" y="360" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="12" fill="#16a34a">✓ 质量门通过才发</text>

  <!-- Small arrow doodle -->
  <path d="M640,355 L650,355" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="647,352 653,355 647,358" fill="#22c55e"/>

  <!-- Footer note -->
  <text x="450" y="480" text-anchor="middle" font-family="'Comic Sans MS','PingFang SC',cursive" font-size="12" fill="#94a3b8">编排层不实现底层能力 · 只做调度 + 质控 + 兜底</text>
</svg>
