<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <defs>
    <!-- Cotton paper texture via noise -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <!-- Soft shadow -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#c4a97d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Cream paper background -->
  <rect width="960" height="580" fill="#faf5ed"/>
  <rect width="960" height="580" fill="#f5ede0" opacity="0.3" filter="url(#paper)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.6" fill="#d4c9b8"/>
  </pattern>
  <rect width="960" height="580" fill="url(#dots)" opacity="0.5"/>

  <!-- === TITLE AREA === -->
  <rect x="40" y="28" width="480" height="46" rx="8" fill="#fff" stroke="#c9b896" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <!-- Placeholder squiggles for title text -->
  <path d="M58,51 C68,47 78,53 90,49 C102,45 112,51 124,48" fill="none" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>
  <path d="M135,51 C148,47 160,53 175,49" fill="none" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>

  <!-- Small label -->
  <rect x="540" y="34" width="100" height="28" rx="14" fill="#e8ddd0" stroke="#c9b896" stroke-width="1"/>
  <path d="M558,48 C565,45 572,50 580,47 C588,44 595,49 605,46" fill="none" stroke="#8b7355" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#e8c36a" opacity="0.7">
    <path d="M700,45 l2,-6 2,6 -6,-2 6,0 -6,2z" transform="scale(0.8)"/>
    <circle cx="720" cy="60" r="2.5"/>
    <path d="M880,38 l1.5,-5 1.5,5 -5,-1.5 5,0 -5,1.5z"/>
  </g>

  <!-- === LAYER 1: ORCHESTRATOR (top center) === -->
  <rect x="240" y="100" width="480" height="95" rx="14" fill="#fff" stroke="#7ba8c9" stroke-width="2" filter="url(#shadow)"/>
  <!-- Left icon: conductor wand -->
  <circle cx="290" cy="140" r="20" fill="#e3f0f7" stroke="#7ba8c9" stroke-width="1.5"/>
  <path d="M284,134 C282,128 286,125 290,128 C294,125 298,128 296,134" fill="none" stroke="#5a8faf" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="290" y1="134" x2="290" y2="152" stroke="#5a8faf" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="290" y1="142" x2="280" y2="150" stroke="#5a8faf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="290" y1="142" x2="300" y2="150" stroke="#5a8faf" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wand sparkle -->
  <line x1="282" y1="126" x2="278" y2="118" stroke="#5a8faf" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="277" cy="116" r="2" fill="#e8c36a"/>

  <!-- Card title squiggle -->
  <path d="M330,128 C360,123 400,131 440,126 C480,121 520,129 560,125" fill="none" stroke="#5a8faf" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Subtitle squiggle -->
  <path d="M330,150 C370,147 410,153 450,148 C490,143 530,150 570,146" fill="none" stroke="#9ab8cc" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Small tags -->
  <rect x="330" y="162" width="40" height="16" rx="8" fill="#e3f0f7"/>
  <rect x="378" y="162" width="40" height="16" rx="8" fill="#fde8cd"/>
  <rect x="426" y="162" width="40" height="16" rx="8" fill="#e3f0f7"/>

  <!-- === ARROW DOWN (center split) === -->
  <line x1="480" y1="195" x2="480" y2="225" stroke="#9ab8cc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="475,222 480,232 485,222" fill="#9ab8cc"/>
  <!-- Arrow splits left and right -->
  <path d="M480,232 C478,242 300,242 280,248" fill="none" stroke="#9ab8cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="282,244 276,250 284,252" fill="#9ab8cc"/>
  <path d="M480,232 C482,242 660,242 680,248" fill="none" stroke="#9ab8cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="678,244 684,250 676,252" fill="#9ab8cc"/>

  <!-- === LAYER 2: RENDERER (left) === -->
  <rect x="50" y="255" width="380" height="120" rx="14" fill="#fff" stroke="#e8a54c" stroke-width="2" filter="url(#shadow)"/>
  <!-- Icon: paint palette -->
  <circle cx="105" cy="305" r="22" fill="#fef3e2" stroke="#e8a54c" stroke-width="1.5"/>
  <ellipse cx="100" cy="298" rx="5" ry="4" fill="#e8c36a"/>
  <ellipse cx="112" cy="295" rx="4" ry="3.5" fill="#7ba8c9"/>
  <ellipse cx="96" cy="308" rx="4" ry="3.5" fill="#a8c97b"/>
  <ellipse cx="110" cy="310" rx="3.5" ry="3" fill="#e8a54c"/>
  <circle cx="105" cy="303" r="3" fill="#fef3e2" stroke="#e8a54c" stroke-width="1"/>

  <path d="M145,285 C200,280 280,288 360,283" fill="none" stroke="#c4893a" stroke-width="2" stroke-linecap="round"/>
  <path d="M145,305 C195,302 250,308 310,303" fill="none" stroke="#e8c9a0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Theme swatches -->
  <rect x="145" y="320" width="18" height="12" rx="3" fill="#7ba8c9"/>
  <rect x="170" y="320" width="18" height="12" rx="3" fill="#e8a54c"/>
  <rect x="195" y="320" width="18" height="12" rx="3" fill="#a8c97b"/>
  <rect x="220" y="320" width="18" height="12" rx="3" fill="#e88a8a"/>
  <text x="250" y="331" font-family="sans-serif" font-size="10" fill="#c4893a">52</text>

  <!-- === GATE (center, between layers 2 and 3) === -->
  <rect x="440" y="285" width="80" height="60" rx="30" fill="#fef2f2" stroke="#e07070" stroke-width="2" filter="url(#shadow)"/>
  <!-- Shield icon -->
  <path d="M480,300 C477,294 483,290 480,290 C477,290 483,294 480,300" fill="none" stroke="#e07070" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M475,302 C474,296 480,292 480,292 C480,292 486,296 485,302 C485,308 480,314 480,314 C480,314 475,308 475,302Z" fill="none" stroke="#d05050" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M460,325 C470,322 490,322 500,325" fill="none" stroke="#e07070" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow from gate down -->
  <line x1="480" y1="345" x2="480" y2="385" stroke="#9ab8cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="475,382 480,392 485,382" fill="#9ab8cc"/>

  <!-- Arrow between renderer and gate -->
  <line x1="430" y1="315" x2="440" y2="315" stroke="#9ab8cc" stroke-width="1.2" stroke-dasharray="3,2"/>
  <!-- Arrow between gate and publisher -->
  <line x1="520" y1="315" x2="530" y2="315" stroke="#9ab8cc" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- === LAYER 3: PUBLISHER (right) === -->
  <rect x="530" y="255" width="380" height="120" rx="14" fill="#fff" stroke="#e07070" stroke-width="2" filter="url(#shadow)"/>
  <!-- Icon: rocket -->
  <circle cx="585" cy="305" r="22" fill="#fef2f2" stroke="#e07070" stroke-width="1.5"/>
  <path d="M585,290 C580,296 582,302 585,306 C588,302 590,296 585,290Z" fill="#e07070" stroke="#c05050" stroke-width="1"/>
  <line x1="581" y1="306" x2="578" y2="314" stroke="#c05050" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="585" y1="306" x2="585" y2="315" stroke="#e8c36a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="589" y1="306" x2="592" y2="314" stroke="#c05050" stroke-width="1.2" stroke-linecap="round"/>

  <path d="M625,285 C680,280 760,288 840,283" fill="none" stroke="#c05050" stroke-width="2" stroke-linecap="round"/>
  <path d="M625,305 C675,302 730,308 790,303" fill="none" stroke="#e8b0b0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Channel icons -->
  <rect x="625" y="320" width="50" height="16" rx="8" fill="#fef2f2" stroke="#e07070" stroke-width="0.8"/>
  <rect x="685" y="320" width="50" height="16" rx="8" fill="#fef2f2" stroke="#e07070" stroke-width="0.8"/>
  <rect x="745" y="320" width="50" height="16" rx="8" fill="#fef2f2" stroke="#e07070" stroke-width="0.8"/>

  <!-- === OUTPUT AREA (bottom) === -->
  <!-- Blog output -->
  <rect x="200" y="400" width="220" height="70" rx="12" fill="#fff" stroke="#a88cc9" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <circle cx="240" cy="430" r="14" fill="#f3e8ff" stroke="#a88cc9" stroke-width="1.2"/>
  <rect x="234" y="424" width="12" height="14" rx="2" fill="none" stroke="#8a6ab5" stroke-width="1.2"/>
  <line x1="237" y1="430" x2="243" y2="430" stroke="#8a6ab5" stroke-width="1"/>
  <line x1="237" y1="434" x2="241" y2="434" stroke="#8a6ab5" stroke-width="1"/>
  <path d="M268,422 C300,418 340,425 380,420" fill="none" stroke="#8a6ab5" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M268,442 C290,439 320,444 360,440" fill="none" stroke="#c9b0dd" stroke-width="1" stroke-linecap="round"/>

  <!-- Platform output -->
  <rect x="540" y="400" width="220" height="70" rx="12" fill="#fff" stroke="#e07070" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <circle cx="580" cy="430" r="14" fill="#fef2f2" stroke="#e07070" stroke-width="1.2"/>
  <rect x="574" y="424" width="12" height="14" rx="3" fill="none" stroke="#c05050" stroke-width="1.2"/>
  <path d="M578,430 C580,427 582,430 580,433 C578,430 580,427 580,430Z" fill="#e07070"/>
  <path d="M608,422 C640,418 680,425 720,420" fill="none" stroke="#c05050" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M608,442 C630,439 660,444 700,440" fill="none" stroke="#e8b0b0" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrows to outputs -->
  <path d="M380,375 C370,388 340,395 320,400" fill="none" stroke="#9ab8cc" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M580,375 C590,388 620,395 640,400" fill="none" stroke="#9ab8cc" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- === DECORATIVE ELEMENTS === -->
  <!-- Magnifying glass (bottom left) -->
  <circle cx="80" cy="460" r="28" fill="none" stroke="#c9b896" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="480" x2="118" y2="498" stroke="#c9b896" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Tiny nodes inside magnifying glass -->
  <circle cx="74" cy="454" r="3" fill="#e3f0f7" stroke="#7ba8c9" stroke-width="0.8" opacity="0.6"/>
  <circle cx="88" cy="452" r="2.5" fill="#fef3e2" stroke="#e8a54c" stroke-width="0.8" opacity="0.6"/>
  <circle cx="78" cy="468" r="2" fill="#f3e8ff" stroke="#a88cc9" stroke-width="0.8" opacity="0.6"/>
  <line x1="77" y1="456" x2="86" y2="454" stroke="#c9b896" stroke-width="0.6" opacity="0.5"/>
  <line x1="76" y1="466" x2="82" y2="458" stroke="#c9b896" stroke-width="0.6" opacity="0.5"/>

  <!-- Stars and sparkles scattered -->
  <g fill="#e8c36a" opacity="0.5">
    <path d="M910,100 l3,-8 3,8 -8,-3 8,0 -8,3z"/>
    <path d="M40,140 l2,-6 2,6 -6,-2 6,0 -6,2z"/>
    <circle cx="500" cy="80" r="2.5"/>
    <circle cx="150" cy="500" r="3"/>
    <path d="M850,460 l2,-5 2,5 -5,-2 5,0 -5,2z"/>
  </g>
  <g fill="#7ba8c9" opacity="0.3">
    <circle cx="920" cy="250" r="2"/>
    <circle cx="30" cy="350" r="2.5"/>
  </g>
  <g fill="#a8c97b" opacity="0.4">
    <circle cx="460" cy="520" r="2"/>
    <path d="M770,150 l1.5,-5 1.5,5 -5,-1.5 5,0 -5,1.5z"/>
  </g>

  <!-- Small gears decoration (bottom right) -->
  <circle cx="900" cy="520" r="12" fill="none" stroke="#c9b896" stroke-width="1" opacity="0.4"/>
  <circle cx="900" cy="520" r="6" fill="none" stroke="#c9b896" stroke-width="0.8" opacity="0.4"/>
  <line x1="900" y1="507" x2="900" y2="512" stroke="#c9b896" stroke-width="1" opacity="0.4"/>
  <line x1="900" y1="528" x2="900" y2="533" stroke="#c9b896" stroke-width="1" opacity="0.4"/>
  <line x1="887" y1="520" x2="892" y2="520" stroke="#c9b896" stroke-width="1" opacity="0.4"/>
  <line x1="908" y1="520" x2="913" y2="520" stroke="#c9b896" stroke-width="1" opacity="0.4"/>

  <!-- Footer note squiggle -->
  <path d="M200,540 C300,536 400,544 500,538 C600,532 700,540 780,536" fill="none" stroke="#c9b896" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
